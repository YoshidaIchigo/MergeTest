name: Cascade Merge Relay

on:
  push:
    # release/ver1.0 〜 release/ver4.0 へのPushで発火するようにパターン指定
    branches:
      - 'release/ver*.0'
      - 'ver*' # 念のため ver1 形式にも対応

jobs:
  cascade-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CASCADE_MERGE_PAT }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Target Branch and Execute Relay
        env:
          GITHUB_TOKEN: ${{ secrets.CASCADE_MERGE_PAT }}
        run: |
          # 1. 現在のブランチ名を取得 (例: release/ver1.0)
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Current branch: ${CURRENT_BRANCH}"
          
          # 2. 数字部分（メジャーバージョン）のみを取り出して +1 する
          # "release/ver1.0" や "ver1" から "1" を抽出
          CURRENT_NUM=$(echo "$CURRENT_BRANCH" | grep -oE '[0-9]+' | head -n 1)
          TARGET_NUM=$((CURRENT_NUM + 1))
          
          # プレフィックス(release/ver や ver)の形式に合わせてターゲットブランチ名を組み立てる
          if [[ "$CURRENT_BRANCH" == release/ver* ]]; then
            TARGET_BRANCH="release/ver${TARGET_NUM}.0"
          else
            TARGET_BRANCH="ver${TARGET_NUM}"
          fi
          
          echo "=== マージリレー処理開始: ${CURRENT_BRANCH} -> ${TARGET_BRANCH} ==="
          
          # 3. ターゲットブランチが存在するかチェック
          if ! git rev-parse --verify origin/$TARGET_BRANCH >/dev/null 2>&1; then
            echo "ターゲットブランチ ${TARGET_BRANCH} が存在しないため、リレーを終了します。"
            exit 0
          fi
          
          # 4. ターゲットブランチをチェックアウト
          git checkout $TARGET_BRANCH
          
          # 5. 自動マージを試行
          if git merge --no-ff --no-commit origin/$CURRENT_BRANCH; then
            echo "✅ ${CURRENT_BRANCH} から ${TARGET_BRANCH} への自動マージ成功！"
            git commit -m "chore: Cascade auto-merge from ${CURRENT_BRANCH}"
            git push origin $TARGET_BRANCH
            echo "次の中継イベントが自動発火します。"
          else
            echo "⚠️ ${CURRENT_BRANCH} から ${TARGET_BRANCH} へのマージでコンフリクト発生！"
            
            # ブランチ名にスラッシュが含まれる場合の対策処理
            SAFE_CURRENT=$(echo "$CURRENT_BRANCH" | sed 's/\//-/g')
            SAFE_TARGET=$(echo "$TARGET_BRANCH" | sed 's/\//-/g')
            TEMP_BRANCH="relay/conflict-${SAFE_CURRENT}-to-${SAFE_TARGET}"
            
            git checkout -b $TEMP_BRANCH
            git add .
            git commit -m "conflict: Needs manual resolution for cascade merge from ${CURRENT_BRANCH}"
            git push origin $TEMP_BRANCH --force
            
            gh pr create \
              --title "⚠️ [要手動解消] Cascade Merge: ${CURRENT_BRANCH} -> ${TARGET_BRANCH}" \
              --body "自動マージリレー中にコンフリクトが発生したためバトンを一時停止しました。${TEMP_BRANCH} ブランチで衝突を修正してマージしてください。" \
              --base $TARGET_BRANCH \
              --head $TEMP_BRANCH
          fi
